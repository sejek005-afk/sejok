plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.sejok.contractor'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.sejok.contractor'
        minSdk 21
        targetSdk 34
        // تنها محل تعریف نسخه؛ برنامه آن را از BuildConfig.VERSION_NAME می‌خواند
        versionCode 19
        versionName '1.0'
    }

    // کلید امضای نسخه release فقط از متغیرهای محیطی خوانده می‌شود (در GitHub Actions از Secrets).
    // اگر تنظیم نشده باشد، release بدون امضا ساخته می‌شود و debug با کلید پیش‌فرض debug امضا می‌شود.
    def env = System.getenv()
    def signStore = env['SIGNING_STORE_FILE']
    def hasSigning = signStore && new File(signStore).exists() &&
            env['SIGNING_STORE_PASSWORD'] && env['SIGNING_KEY_ALIAS'] && env['SIGNING_KEY_PASSWORD']

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile new File(signStore)
                storePassword env['SIGNING_STORE_PASSWORD']
                keyAlias env['SIGNING_KEY_ALIAS']
                keyPassword env['SIGNING_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        checkReleaseBuilds true
        abortOnError false
        textReport true
        textOutput file("build/reports/lint-results-release.txt")
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
