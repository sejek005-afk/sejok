name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# پیش‌فرض فقط خواندن؛ فقط مرحله انتشار اجازه نوشتن دارد
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Check bundled fonts
        run: |
          test -s app/src/main/assets/Vazirmatn.woff2
          test -s app/src/main/assets/Lalezar.ttf

      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets are not set - building a debug-signed APK. See docs/SIGNING_FA.md"
            echo "SIGNED=0" >> "$GITHUB_ENV"
          fi

      - name: Build APK and AAB
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace
          fi

      - name: Lint report
        continue-on-error: true
        run: ./gradlew lintRelease --no-daemon

      - name: Collect outputs
        run: |
          mkdir -p out
          if [ "$SIGNED" = "1" ]; then
            cp app/build/outputs/apk/release/app-release.apk out/rawano.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk out/rawano.apk
            echo "DEBUG-SIGNED BUILD: signing secrets missing (see docs/SIGNING_FA.md)" > out/SIGNING_WARNING.txt
          fi
          cp app/build/outputs/bundle/release/*.aab out/rawano.aab
          cp app/build/reports/lint-results-release.txt out/lint-results.txt 2>/dev/null || true
          rm -f "$RUNNER_TEMP/release.keystore"
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rawano
          path: out/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rawano
          path: out

      - name: Publish APK to apk branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b apk
          echo "APK built from ${GITHUB_SHA}" > README.md
          git add -A
          git commit -q -m "APK for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" apk
