name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Download Persian fonts (Vazirmatn, Lalezar)
        continue-on-error: true
        run: |
          curl -fsSL -o app/src/main/assets/Vazirmatn.woff2 \
            https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/fonts/webfonts/Vazirmatn%5Bwght%5D.woff2 \
          || curl -fsSL -o app/src/main/assets/Vazirmatn.woff2 \
            "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/webfonts/Vazirmatn%5Bwght%5D.woff2"
          curl -fsSL -o app/src/main/assets/Lalezar.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/lalezar/Lalezar-Regular.ttf || true
          ls -la app/src/main/assets/

      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets are not set - building a debug-signed APK. See docs/SIGNING_FA.md"
            echo "SIGNED=0" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Rename APK
        run: |
          mkdir -p out
          if [ "$SIGNED" = "1" ]; then
            cp app/build/outputs/apk/release/app-release.apk out/contractor.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk out/contractor.apk
            echo "DEBUG-SIGNED BUILD: signing secrets missing" > out/SIGNING_WARNING.txt
          fi
          rm -f "$RUNNER_TEMP/release.keystore"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: contractor-apk
          path: out/contractor.apk

      - name: Publish APK to apk branch
        run: |
          cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b apk
          echo "APK built from ${GITHUB_SHA}" > README.md
          git add contractor.apk README.md
          [ -f SIGNING_WARNING.txt ] && git add SIGNING_WARNING.txt
          git commit -q -m "APK for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
